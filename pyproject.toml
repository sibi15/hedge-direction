[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-direction"
version = "2.0.0"
description = "Difference-in-means steering/ablation of the 'hedging' direction in chat LLMs"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "tqdm"]

[tool.setuptools]
packages = ["hedge"]
